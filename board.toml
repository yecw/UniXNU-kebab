schema_version = 2

# Board description of the OnePlus 8T (kebab, SM8250), read by the unixnu build
# driver. Format 2: SoC resources come from UniXNU-sm8250-common, the OS profile
# from the UniXNU base profiles, and this file keeps the board wiring.

[board]
name = "kebab"
soc = "SM8250"
soc_source = "sm8250"
os_profile = "ipados-17.7.11-21H461"
description = "OnePlus 8T"
kit = "kebab"        # device package/ appears as kits/kebab

[components]
# VerifiedRoot supplies kits/VerifiedRoot (the owner-verified-root C provider and the
# manifest/key tooling) for the storage driver's window authentication.
include = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "DarwinBoot", "VerifiedRoot", "SoftwareAES", "RamBlock"]

# Donor IPSW: the kernel is built from Apple's XNU source and prelinked against
# this kernelcache, so the donor only has to match the XNU version and prelink
# ABI - it is not a device we emulate.
[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]
"044-76040-038.dmg" = "3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d"
"044-76034-038.dmg" = "b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f"

# GPT entry "userdata" on LU0. The 12+256 KB2000 unit reports
#   partition-size:userdata = 0x365D3DB000 = 233,492,557,824 bytes
#   => 57,005,019 logical blocks of 4096 bytes.
[userdata]
first_lba = 4748320    # GPT of the KB2000 9008 package (gpt_main0.bin)
last_lba = 61748338    # first + 57,005,019 - 1 (measured partition size)
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
defconfig = "kebab_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8250.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "device:patches/xnu/series"]
archives = [
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  "build-libpthread-kernel.py",
  "build-kebab-stubs.py",
  "build-kebab-storage.py",
  # Original-PMGR bridge: package/ShengPlatformPower.cpp and this builder are
  # taken from UniXNU-pipa (kits/pipa, scripts/), not rewritten here.
  "build-platform-power.py",
  # Boot progress zone writer (boot-progress=1); the source is UniXNU-pipa's
  # BootRamoops.c with its restart/PMIC paths disabled.
  "build-boot-progress.py",
  # Data volume (/private/var): the official RAM transport publishes a real
  # IOMedia seeded from the payload's scratch-data.img, and SoftwareAES is the
  # qualified crypto closure the kernel's build guard requires for it.
  "component:SoftwareAES",
  "build-software-aes-bindings.py",
  "component:RamBlock",
]

# Values below match the donor kernelcache pinned above; re-check them if the
# IPSW ever changes.
[kernel.prelink]
tool = "kits/XnuPrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7"
slide = "-0x1000000"
# The built-in kebab AMFI provider replaces the Apple kext, so it is no longer
# force-loaded at early boot (and removed from the roots below). The profile still
# supplies the initializer, so override it explicitly with an empty value.
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.security.AppleImage4",
]

# Board device tree. dts/kebab.dts is the tree this unit runs: it keeps the
# splash reservation ABL needs and the controller nodes the firmware relies on.
[device_tree]
source = "device:dts/kebab.dts"
include_dirs = ["soc:dts"]

# Firmware built from our Mu-Silicium tree.
[firmware]
config = "kebab"
dsc = "Platforms/OnePlus/kebabPkg/kebab.dsc"
fd = "Build/kebabPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
packages = [
  "{uefi}",
  "{uefi}/Platforms/OnePlus",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/OnePlus",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
  "{tree}/package",
  "{tree}/drivers",
  "{tree}/drivers/DarwinBoot",
]
defines = { ENABLE_SECUREBOOT = 0, DEVICE_MODEL = 0 }

# Apple device tree for the kebab board. The hardware values come from this
# device's own firmware: MADT (GICv3 0x17A00000 / 0x17A60000), MemoryMapLib
# (DRAM base 0x80000000), and the UFS host controller measured at 0x01D84000.
[payload.adt]
# APFS root (System) volume of the OS window in userdata; the ADT writes
# /chosen/root-matching so XNU selects the IOMedia with this UUID.
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"
owned_memory_size = "0x100000000"   # 4 GiB: the window the 2026-11 record reached the kernel with
# DarwinBoot fills this many (base, size) slots with the DRAM banks outside the
# main window; the kernel's 0366 route reads them to admit the extra banks.
owned_memory_outside_ranges = 64   # 4 GiB: the window the 2026-11 record reached the kernel with
tool = "scripts/make-kebab-adt.py"
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"
ipad_identity = false
iphone_identity = true
chip_id = "0x8250"
unique_chip_id = "required"

# The payload volume DarwinBoot reads: the kernel, its device tree and the
# optional trust cache and Data seed. The loader is part of the firmware volume.
[payload]
volume = "KEBABESP"
size_mib = 100   # the Data seed is 32 MiB next to the ~58 MB kernel
loader = "firmware"
title = "kebab first boot: source 4K XNU to console"
dram_size = "0xC0000000"   # must match the hardware DTS memory node
panic_screen = true
# The early console prints arm_init stages on the panel; no reset probe (SMC
# SYSTEM_RESET does not reset this board, so it only hangs the kernel).
# TEMPORARY: print a message through panic() at a chosen point; the panic screen
# draws it on the panel (no console, no UART). Remove once the point is answered.
# No entry probe: this is the baseline boot image.
kernel_args = [
  "-v",
  # Early debug output mask and platform/IPI arguments of the working SM8250 ports:
  # Qualcomm never raises the SGIs that ICC_SGI1R_EL1 asks for, so IPIs have to be
  # software-pended SPIs (pipa and gts7xlwifi records, UniXNU boot-argument reference).
  "debug=0x14e",
  "armcpu-self-ipi=1",
  "armcpu-spi-ipi=1",
  "armcpu-diagnostics=1",
  # Publish the original PMGR nub through the bridge (AMFI panics with "No PMGR" without it).
  "sheng-pmgr=2",
  "rd=ufsroot0",
  "ufsroot=userdata",
  "ufsmedia_root=2",
  "launchdsuffix=release",
  "amfi_get_out_of_my_way=1",
  "rootrw=0",
  "keepsyms=1",
  "cpus=1",
  # Ask kernel_bootstrap/kernel_bootstrap_thread to print every phase on the
  # console; the panel is the only log this board has.
  "startup_debug=1",
  "kt_fixed_zones=120",
  # dyld's libIgnition asks security.mac.img4.ignition_blob; the Image4 handler
  # never returns on this port, so 10063-kebab-image4-ignition.patch answers
  # ENOENT for that one MIB while this argument is present (bring-up only).
  "kebab_skip_ignition_blob=1",
  # libIgnition (dyld) reads this from the boot args: level 5 (the default) takes
  # the strict boot-cryptex path and looks for preboot/Cryptexes/OS; the
  # reference rk20port uses level 1, which looks for the shared cache in the
  # cryptexes we already mounted.
  "ignition_level=1",
  # Owner-verified root: the OS window must match the owner-signed manifest
  # (10063-kebab-boot-manifest material + KebabBlockStorage verification).
  "kebab_verify_root=1",
  # Split dyld shared cache: parse and log the mapping plan (dry run).
  "kebab_dsc=1",
  # AMFI launch-constraint relaxation (zzyc-owner-skip-launch-constraints).
  "no-lc=1",
  # kebab code-signing policy: unsigned Mach-O ok, trust-cache classification,
  # entitlements answered, unsealed-root shared cache accepted (0x1|0x2|0x4|0x8).
  "kebab_cs=15",
  # Bring-up instrument: panic before exec with the cache-path probe result, so
  # the numbers are visible on the panic screen (marks are painted over).
]

# OnePlus ABL on kebab: header v2 / 4096-byte pages. "fastboot boot" is refused by
# ABL for unsigned images, so the image is flashed to boot_a.
#
# The dtb passed to mkbootimg MUST be the phone's own live device tree: the one
# shipped in Mu-Silicium has no cont_splash_region@9c000000 and ABL then refuses
# to hand the framebuffer over, which shows up as a black screen.
[bootimg.image]
header_version = 2
pagesize = 4096
kernel_offset = 0x8000
tags_offset = 0x100
dtb_offset = 0x1f00000

[adt.chosen.u32]
display-scale = 2
display-rotation = 0

[adt.defaults.u32]
sleep-disabled = 1
